services:

  backend:
    build: ./backend
    container_name: oracle_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_MAX_OUTPUT_TOKENS=${GEMINI_MAX_OUTPUT_TOKENS:-800}
      # Doit suivre FRONTEND_PORT : le navigateur appelle ce backend depuis
      # l'origine http://localhost:<FRONTEND_PORT> servie par le conteneur frontend.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-5174}}
      - GEMINI_TEMPERATURE=${GEMINI_TEMPERATURE:-0.7}
    command: python app.py
    restart: unless-stopped
    healthcheck:
      # urllib (stdlib) plutôt que curl/requests : évite d'installer un
      # paquet supplémentaire juste pour le healthcheck.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - oracle-network

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: oracle_frontend
    ports:
      # Port hôte configurable (FRONTEND_PORT dans .env) : évite un conflit
      # avec un autre projet qui utiliserait déjà le 5173 en local.
      - "${FRONTEND_PORT:-5174}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Toutes les routes Flask sont sous /api/ (voir backend/app.py) : sans
      # ce suffixe, chaque appel visait une URL inexistante (404 -> "Requête
      # invalide" côté frontend, voir services/api.js#classifyResponseError).
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "--host"]
    restart: unless-stopped
    healthcheck:
      # target: dev sert le serveur de dev Vite (hot-reload) ici, pas le
      # build statique nginx (utilisé par le stage "production", voir
      # frontend/Dockerfile) : on vérifie donc que ce serveur répond.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - oracle-network

  airflow-db:
    image: postgres:14
    container_name: oracle_airflow_db
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - airflow-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oracle-network

  airflow-init:
    build: ./Airflow
    container_name: oracle_airflow_init
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
    volumes:
      - ./Airflow/dags:/opt/airflow/dags
      - airflow-logs-volume:/opt/airflow/logs
      - ./backend:/opt/airflow/backend
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USERNAME:?Définissez AIRFLOW_ADMIN_USERNAME dans .env (voir .env.example)}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:?Définissez AIRFLOW_ADMIN_PASSWORD dans .env (voir .env.example)}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" || true
        echo "✅ Airflow prêt → http://localhost:8082"
    networks:
      - oracle-network

  airflow-webserver:
    build: ./Airflow
    container_name: oracle_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY:?Définissez AIRFLOW__WEBSERVER__SECRET_KEY dans .env (voir .env.example, ex. via `openssl rand -hex 30`)}
    volumes:
      - ./Airflow/dags:/opt/airflow/dags
      - airflow-logs-volume:/opt/airflow/logs
      - ./backend:/opt/airflow/backend
    ports:
      - "8082:8080"
    command: webserver
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - oracle-network

  airflow-scheduler:
    build: ./Airflow
    container_name: oracle_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
    volumes:
      - ./Airflow/dags:/opt/airflow/dags
      - airflow-logs-volume:/opt/airflow/logs
      - ./backend:/opt/airflow/backend
    command: scheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - oracle-network

volumes:
  airflow-db-volume:
  airflow-logs-volume:

networks:
  oracle-network:
    driver: bridge
