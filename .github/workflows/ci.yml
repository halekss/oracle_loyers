name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt pytest

      - run: python -m pytest tests/ -v

  scrapers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      # setuptools fournit le shim distutils dont dépend undetected-chromedriver==3.5.5,
      # supprimé de la stdlib depuis Python 3.12.
      - run: pip install setuptools
      - run: pip install -r requirements.txt pytest

      # tests/e2e/ = canaris Playwright contre les sites live (ORA-20), lents et
      # dépendants du réseau : exécutés séparément sur planification (ORA-21),
      # pas sur chaque push/PR.
      - run: python -m pytest tests/ -v --ignore=tests/e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test

  e2e:
    # Parcours utilisateur critique (ORA-59) : Playwright pilote le vrai build
    # de production (`vite preview`) contre un vrai backend Flask (webServer
    # dans playwright.config.js), pas des mocks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - run: npm run test:e2e
        working-directory: frontend
