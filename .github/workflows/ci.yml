name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt pytest

      - run: python -m pytest tests/ -v

  scrapers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      # setuptools fournit le shim distutils dont dépend undetected-chromedriver==3.5.5,
      # supprimé de la stdlib depuis Python 3.12.
      - run: pip install setuptools
      - run: pip install -r requirements.txt pytest

      # tests/e2e/ = canaris Playwright contre les sites live (ORA-20), lents et
      # dépendants du réseau : exécutés séparément sur planification (ORA-21),
      # pas sur chaque push/PR.
      - run: python -m pytest tests/ -v --ignore=tests/e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test

  e2e:
    # Parcours utilisateur critique (ORA-59) : Playwright pilote le vrai build
    # de production (`vite preview`) contre un vrai backend Flask (webServer
    # dans playwright.config.js), pas des mocks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - run: npm run test:e2e
        working-directory: frontend

  deploy:
    # CD (ORA-64) : ne se déclenche que sur un push vers main, et seulement
    # si backend/scrapers/frontend/e2e ont TOUS réussi — `needs:` + le `if:`
    # explicite ci-dessous (nécessaire car ajouter un `if:` sur un job avec
    # `needs` remplace la condition implicite success(), il faut la
    # réécrire explicitement pour qu'un échec de test bloque bien le déploi).
    name: Déploiement (Render)
    needs: [backend, scrapers, frontend, e2e]
    if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le déploiement backend (Render Deploy Hook)
        if: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"

      - name: Déclencher le déploiement frontend (Render Deploy Hook)
        if: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"

      - name: Avertir si aucun hook n'est configuré
        if: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND == '' && secrets.RENDER_DEPLOY_HOOK_FRONTEND == '' }}
        run: echo "::warning::Aucun secret RENDER_DEPLOY_HOOK_BACKEND/RENDER_DEPLOY_HOOK_FRONTEND configuré — déploiement non déclenché. Voir README, section CD."
